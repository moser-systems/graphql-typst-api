name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      # No fonts are installed here on purpose: the test fixtures compile against
      # Typst's embedded faces, which keeps the suite hermetic.
      - run: uv run pytest
      - if: matrix.python == '3.13'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  example-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run graphql-typst check --bundle-dir examples/bundle
      # Downloads the @preview packages, so it is kept out of the matrix job.
      - run: GRAPHQL_TYPST_TEST_NETWORK=1 uv run pytest tests/test_examples.py --no-cov

  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: graphql-typst:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image ships the fonts and packages it needs
        run: |
          docker run --rm --entrypoint fc-match graphql-typst:ci "Liberation Sans"
          docker run --rm --entrypoint ls graphql-typst:ci \
            /opt/graphql-typst/typst-packages/preview
      - name: The bundle validates with no network at all
        run: |
          docker run --rm --network none \
            -e GRAPHQL_TYPST_GRAPHQL_URL=http://upstream.invalid/graphql \
            graphql-typst:ci check
      - name: The service starts and answers its probes
        run: |
          docker run -d --name api -p 8000:8000 \
            -e GRAPHQL_TYPST_GRAPHQL_URL=http://upstream.invalid/graphql \
            graphql-typst:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/v1/templates | tee /dev/stderr | grep -q invoice
          # No upstream exists, so a render must fail as a clean 502, not a crash.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"args":{"id":"1"}}' \
            http://127.0.0.1:8000/v1/render/invoice)
          test "$code" = "502" || { echo "expected 502, got $code"; docker logs api; exit 1; }
          docker rm -f api
