name: dependabot auto-merge

# Patch updates merge themselves once the required checks pass. Anything larger
# stays for a human: a patch bump that breaks something is caught by CI, a minor
# one may change behaviour CI does not assert.
#
# Safety notes:
#   * `on: pull_request` gives fork PRs a read-only token, and the actor check
#     below rejects them anyway.
#   * Nothing is checked out and no PR code runs here, so a poisoned branch has
#     nothing to execute despite the write permissions.
#   * `--auto` only queues the merge. It lands when the branch's required status
#     checks pass, so this is exactly as safe as the branch protection on main.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Queue patch updates for merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # A merge performed with GITHUB_TOKEN does not raise a push event, so
          # docker.yml will not rebuild the image for an auto-merged patch; the
          # next human push or release tag picks it up. Swap in a GitHub App
          # token here if the image must be rebuilt immediately.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
